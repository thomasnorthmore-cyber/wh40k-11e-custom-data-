name: Catalogue regression checks
on:
  push:
    paths:
      - '*.gst'
      - '*.cat'
      - 'scripts/validate_catalogue.py'
      - '.github/workflows/catalogue-tests.yml'
  pull_request:
jobs:
  validate-catalogues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalogue structure
        run: python scripts/validate_catalogue.py
