name: Catalogue regression checks
on:
  push:
    paths:
      - '*.gst'
      - '*.cat'
      - 'scripts/*.py'
      - 'data/structured/**'
      - '.github/workflows/catalogue-tests.yml'
  pull_request:
jobs:
  validate-catalogues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all 99 source Aeldari datasheets
        run: python scripts/expand_aeldari.py --out /tmp/aeldari-full-preview.cat
      - name: Validate complete 99-unit Aeldari preview
        run: python scripts/validate_full_aeldari.py /tmp/aeldari-full-preview.cat
      - name: Check structured data matches catalogue
        run: python scripts/build_catalogue.py --check
      - name: Test generator applies structured changes
        run: python scripts/build_catalogue.py --self-test
      - name: Check standalone JSON exporter parity
        run: python scripts/export_standalone.py --check
      - name: Test standalone JSON exporter independence
        run: python scripts/export_standalone.py --self-test
      - name: Test Yellowscribe roster compatibility adapter
        run: python scripts/yellowscribe_compat.py --self-test
      - name: Validate model-specific loadout legality
        run: python scripts/loadout_rules.py
      - name: Validate equipment ownership across all units
        run: python scripts/validate_equipment_ownership.py
      - name: Validate all unit selection structure
        run: python scripts/validate_all_units.py
      - name: Validate catalogue structure
        run: python scripts/validate_catalogue.py
      - name: Validate role-category samples
        run: python scripts/validate_category_smoke.py
      - name: Validate multi-wargear selections
        run: python scripts/validate_multi_wargear.py
      - name: Validate other unit wargear choices
        run: python scripts/validate_extended_wargear.py
      - name: Validate weapon profile notation
        run: python scripts/validate_weapon_format.py
      - name: Reject duplicate rules and abilities
        run: python scripts/validate_rule_redundancy.py
